name: skills.json sync

# Drift guard: skills.json is GENERATED from the SKILL.md frontmatters by
# build-skills-json.mjs in Wolfe-Jam/faf-skills-site (kept out of this repo: the
# Claude plugin directory refuses scripts in a plugin from a non-Verified
# organization) and fetched live by skills.faf.one. This fails the build if
# skills.json wasn't regenerated after a SKILL.md change. It reads this repo's
# skills and the Grok plugin's (faf-grok-plugins main). Fix locally, with
# faf-skills-site checked out beside this repo:
#   node ../faf-skills-site/scripts/build-skills-json.mjs  &&  git add skills.json

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'skills.json'
  pull_request:
    paths:
      - 'skills/**'
      - 'skills.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The generator lives in the site repo.
      - uses: actions/checkout@v7
        with:
          repository: Wolfe-Jam/faf-skills-site
          path: .faf-skills-site
      # The Grok Build plugin's skills are listed too (ships_in: grok).
      - uses: actions/checkout@v7
        with:
          repository: Wolfe-Jam/faf-grok-plugins
          path: .faf-grok-plugins
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate skills.json from the SKILL.md files
        run: node .faf-skills-site/scripts/build-skills-json.mjs
        env:
          FAF_SKILLS: ${{ github.workspace }}
          FAF_GROK_PLUGINS: .faf-grok-plugins
      - name: Fail if skills.json drifted from source
        run: |
          if git diff --quiet skills.json; then
            echo "✓ skills.json is in sync with the SKILL.md files"
          else
            echo "::error file=skills.json::skills.json is OUT OF SYNC with the SKILL.md files. Run 'node ../faf-skills-site/scripts/build-skills-json.mjs' and commit skills.json."
            git --no-pager diff skills.json
            exit 1
          fi
